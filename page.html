<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Curiosità — Article encyclopédique">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>Curiosità</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  :root {
    --bg: #0c0c0e;
    --surface: #141418;
    --surface2: #1c1c22;
    --text: #f0ede8;
    --muted: #7a7870;
    --accent: #e8c97a;
    --accent2: #c97a7a;
    --border: rgba(240,237,232,0.08);
    --green: #69f0ae;
    --accent-dim: rgba(232,201,122,0.1);
  }

  body { line-height: 1.6; min-height: 100vh; }

  /* NOISE TEXTURE */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.5;
  }

  /* === PAGE HEADER === */
  .page-header {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 1rem;
    padding: 0.8rem 1.5rem;
    background: var(--nav-bg, rgba(12,12,14,0.95));
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .page-header-home {
    color: var(--accent); text-decoration: none;
    font-family: 'Playfair Display', serif;
    font-size: 1rem; font-weight: 700;
    white-space: nowrap;
  }
  .page-header-home:hover { opacity: 0.8; }
  .page-breadcrumb {
    font-size: 0.78rem; color: var(--muted); flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .page-breadcrumb a { color: var(--accent); text-decoration: none; }
  .page-breadcrumb a:hover { text-decoration: underline; }
  .page-sep { margin: 0 0.3rem; color: var(--border); }
  .page-sidebar-toggle {
    display: none; background: none; border: 1px solid var(--border);
    color: var(--muted); font-size: 0.75rem; padding: 0.4rem 0.8rem;
    border-radius: 4px; cursor: pointer;
  }

  /* === LAYOUT === */
  .page-body {
    display: flex; min-height: calc(100vh - 50px);
  }

  /* === SIDEBAR === */
  .page-sidebar {
    width: 240px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 1rem; overflow-y: auto;
    position: sticky; top: 50px;
    height: calc(100vh - 50px);
  }
  .page-sidebar-back {
    display: block; font-size: 0.78rem; color: var(--accent);
    text-decoration: none; margin-bottom: 1rem;
  }
  .page-sidebar-back:hover { text-decoration: underline; }
  .page-sidebar-title {
    font-size: 0.65rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted);
    margin-top: 1.5rem; margin-bottom: 0.6rem;
  }
  .page-sidebar-title:first-child { margin-top: 0; }
  .page-sidebar-link {
    display: block; font-size: 0.78rem; color: var(--text);
    text-decoration: none; padding: 0.25rem 0.4rem;
    border-radius: 4px; transition: background 0.15s;
  }
  .page-sidebar-link:hover { background: var(--surface); }
  .page-sidebar-link.active { color: var(--accent); background: var(--accent-dim); }

  .page-sidebar-close {
    display: none; width: 100%; background: none;
    border: 1px solid var(--border); color: var(--muted);
    font-size: 0.78rem; padding: 0.6rem; margin-bottom: 1rem;
    border-radius: 6px; cursor: pointer; text-align: center;
  }

  /* === MAIN CONTENT === */
  .page-main {
    flex: 1; min-width: 0;
  }
  .page-main > .main {
    max-width: 860px; padding: 0 3.5rem 3rem;
  }

  /* === HERO (reuse style.css hero classes) === */
  .page-hero.hero {
    padding-top: 3rem;
    max-width: none;
  }
  .page-hero.hero--course { padding: 2.5rem 2.5rem 2rem; }
  .page-hero.hero--hub { padding: 3rem 2.5rem 2.5rem; }
  .page-hero.hero--discipline { padding: 3.5rem 2.5rem 3rem; }

  .page-loading {
    text-align: center; color: var(--muted);
    padding: 3rem 1rem; font-size: 0.9rem;
  }

  /* === GLOSSARY POPOVER === */
  .gl-popover {
    position: fixed; z-index: 500;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 0; width: 320px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none;
    transition: opacity 0.15s;
  }
  .gl-popover.visible { opacity: 1; pointer-events: auto; }
  .gl-popover-header {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.8rem 1rem 0.4rem; border-bottom: 1px solid var(--border);
  }
  .gl-popover-term {
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: 0.95rem; color: var(--text);
  }
  .gl-popover-tag {
    font-size: 0.6rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--accent);
    background: var(--accent-dim); padding: 0.15rem 0.5rem;
    border-radius: 3px;
  }
  .gl-popover-body {
    padding: 0.6rem 1rem; font-size: 0.8rem;
    color: var(--content-color, rgba(240,237,232,0.85));
    max-height: 180px; overflow-y: auto; line-height: 1.5;
  }
  .gl-popover-footer { padding: 0.4rem 1rem 0.6rem; }
  .gl-popover-link {
    font-size: 0.72rem; color: var(--accent);
    text-decoration: none;
  }
  .gl-popover-link:hover { text-decoration: underline; }

  /* === FOOTER === */
  .page-footer {
    text-align: center; padding: 2rem 1rem;
    border-top: 1px solid var(--border);
    color: var(--muted); font-size: 0.75rem;
  }
  .page-footer a { color: var(--accent); text-decoration: none; }
  .page-footer a:hover { text-decoration: underline; }

  /* === MOBILE === */
  @media (max-width: 768px) {
    .page-sidebar { display: none; }
    .page-sidebar.mobile-open {
      display: block; position: fixed; inset: 0; z-index: 300;
      background: var(--bg); padding: 1rem 1.2rem; overflow-y: auto; width: auto;
      height: auto;
    }
    .page-sidebar.mobile-open .page-sidebar-close { display: block; }
    .page-sidebar-toggle { display: flex !important; }
    .page-hero.hero { padding: 2rem 1.2rem 1.5rem; }
    .page-hero.hero--course { padding: 1.5rem 1.2rem 1rem; }
    .page-hero .hero-deco { font-size: 6rem; right: 0.5rem; top: 0.5rem; }
    .page-main > .main { padding: 0 1.2rem 2rem; }
    .page-header { padding: 0.6rem 1rem; flex-wrap: wrap; gap: 0.5rem; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="page-header">
  <a href="index.html" class="page-header-home">Curiosità</a>
  <div class="page-breadcrumb" id="pageBreadcrumb"></div>
  <button class="page-sidebar-toggle" onclick="document.getElementById('pageSidebar').classList.toggle('mobile-open')">&#9776; Sommaire</button>
</header>

<!-- BODY -->
<div class="page-body">
  <aside class="page-sidebar" id="pageSidebar">
    <button class="page-sidebar-close" onclick="this.parentElement.classList.remove('mobile-open')">&#10005; Fermer</button>
  </aside>
  <div class="page-main" id="pageMain">
    <div class="page-hero hero" id="pageHero"></div>
    <main class="main" id="pageContent">
      <div class="page-loading">Chargement&#8230;</div>
    </main>
  </div>
</div>

<!-- Glossary popover -->
<div class="gl-popover" id="glPopover">
  <div class="gl-popover-header">
    <span class="gl-popover-term"></span>
    <span class="gl-popover-tag"></span>
  </div>
  <div class="gl-popover-body"></div>
  <div class="gl-popover-footer">
    <a class="gl-popover-link" href="#"></a>
  </div>
</div>

<!-- FOOTER -->
<footer class="page-footer">
  <a href="index.html">Curiosità</a> &mdash; &copy; 2026
</footer>

<!-- SCRIPTS -->
<script src="assets/page-viewer.js"></script>
<script src="assets/glossary.js" defer></script>
</body>
</html>
